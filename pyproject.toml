[project]
name = "jevlite"
version = "0.1.0"
description = "Jev-style System One decision model (Choice / Score / Noul) on Qwen3.5-0.8B-Base"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Mourad Ghafiri"}]
dependencies = [
    "torch>=2.7",
    "transformers>=4.57",
    "accelerate",
    "safetensors",
    "pyyaml",
    "numpy",
    "certifi",
]

[project.optional-dependencies]
lora = ["peft"]
serve = ["fastapi", "uvicorn"]
dev = ["pytest"]
plots = ["matplotlib"]

[project.scripts]
jevlite-serve = "jevlite.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
